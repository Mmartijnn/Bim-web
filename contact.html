<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact – Bim</title>
    <meta name="description"
        content="Samenwerken? Stuur ons een bericht voor een nieuw webdesign of een dashboard op maat.">

    <link rel="icon" type="image/png" href="images/opt/favicon.png">
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/contact.css">
</head>

<body>
    <header class="site-header">
        <div class="header-container">
            <a href="index.html" class="site-logo">
                <img src="images/logo.png" alt="Webdesign" width="260" height="173">
            </a>

            <nav class="main-nav" aria-label="Hoofdmenu">
                <a href="index.html">Home</a>
                <a href="contact.html" class="active" aria-current="page">Contact</a>
            </nav>
        </div>
    </header>

    <main class="page">
        <div class="contact-hero">
            <p class="eyebrow">Contact</p>
            <h1>Samenwerken?</h1>
            <p class="sub">Stuur ons een bericht</p>
        </div>

        <!-- ENVELOP MET BRIEF (HET FORMULIER) -->
        <div class="envelope">
            <svg class="envelope-art" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
                <rect width="100" height="100" fill="#d6dade" />
                <polygon points="0,0 100,0 50,48" fill="#c4c9ce" />
                <polygon points="0,0 50,58 0,100" fill="#e3e6e9" />
                <polygon points="100,0 50,58 100,100" fill="#e3e6e9" />
                <polygon points="0,100 50,58 100,100" fill="#eceef0" />
            </svg>

            <section class="letter">
                <!-- <h2>Gesprek?</h2> -->
                <p class="letter-intro">Heeft u een vraag of een idee? Laat een bericht achter, we proberen zo snel
                    mogelijk te antwoorden.</p>

                <!-- Vervang de actie door je eigen formsubmit-adres -->
                <form class="contact-form" action="https://formsubmit.co/JOUW-EMAILADRES" method="POST">
                    <input type="hidden" name="_captcha" value="true">
                    <input type="hidden" name="_template" value="table">
                    <input type="hidden" name="_subject" value="Nieuw bericht via Bim">
                    <input class="honeypot" type="text" name="_honey" tabindex="-1" autocomplete="off"
                        aria-hidden="true">

                    <div class="form-row">
                        <div>
                            <label for="name">Naam</label>
                            <input type="text" id="name" name="name" autocomplete="name" required>
                        </div>
                        <div>
                            <label for="email">E-mail</label>
                            <input type="email" id="email" name="email" autocomplete="email" required>
                        </div>
                    </div>

                    <label for="subject">Onderwerp</label>
                    <input type="text" id="subject" name="subject" required>

                    <label for="message">Bericht</label>
                    <textarea id="message" name="message" rows="6" required></textarea>

                    <button class="send-btn" type="submit">Verstuur bericht</button>
                </form>
            </section>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container footer-content">
            <p>© 2026 Bim</p>
            <p>Over ons</p>
            <p>Wij helpen u graag met uw bedrijf en projecten.</p>
            <p>Wij zijn gevestig in Arnhem.</p>
        </div>
    </footer>
</body>

</html>

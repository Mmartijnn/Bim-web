
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Interactive Book</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: Georgia, serif;
    background: linear-gradient(135deg, #d8fbfd, #bceef3);
    color: #263d47;
}

.heading {
    font: bold 11px Arial, sans-serif;
    letter-spacing: 3px;
    color: #52777d;
    margin-bottom: 55px;
}

/* BOEK */

.book {
    position: relative;
    width: min(760px, 94vw);
    height: min(510px, 65vw);
    min-height: 300px;
    max-height: 510px;
    display: flex;
    perspective: 2200px;
    filter: drop-shadow(0 20px 20px #315d6540);
}

/* PAGINA'S */

.page {
    width: 50%;
    height: 100%;
    position: relative;
    overflow: hidden;
    padding: clamp(15px, 3vw, 38px);
    background-color: #fffdf5;
    background-image: repeating-linear-gradient(
        transparent,
        transparent 29px,
        #e9e3d6 30px
    );
    box-shadow: inset 0 0 12px #0000000c;
}

.left {
    border-radius: 7px 0 0 7px;
    border-right: 1px solid #d5cbb9;
}

.right {
    border-radius: 0 7px 7px 0;
}

/* PAGINA TEKST */

.page-content {
    height: 100%;
    display: flex;
    flex-direction: column;
    position: relative;
}

.page small {
    font: 9px Arial, sans-serif;
    color: #a68b60;
    letter-spacing: 2px;
    margin-bottom: 17px;
}

.page h2 {
    font-size: clamp(17px, 3vw, 27px);
    line-height: 1.15;
    color: #1d3d4a;
    margin: 0 0 18px;
}

.page p {
    font-size: clamp(9px, 1.5vw, 13px);
    line-height: 1.8;
    color: #657078;
    margin: 0 0 12px;
}

/* INHOUDSOPGAVE */

.toc {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.toc a {
    display: flex;
    justify-content: space-between;
    color: #405c64;
    font-size: clamp(9px, 1.5vw, 13px);
    text-decoration: none;
    border-bottom: 1px dotted #b6aa96;
    padding-bottom: 7px;
}

.toc a:hover {
    color: #b18a51;
}

.page-number {
    position: absolute;
    bottom: 0;
    color: #a99b82;
    font: 11px Georgia, serif;
}

/* PAGINA KLIKZONES */

.page.left,
.page.right {
    cursor: pointer;
}

.page.left:hover,
.page.right:hover {
    box-shadow: inset 0 0 18px #b9955e18;
}

/* KAFT */

.cover {
    position: absolute;
    z-index: 20;
    width: 50%;
    height: 100%;
    right: 0;
    top: 0;
    transform-origin: left center;
    transform-style: preserve-3d;
    transition: transform 1.5s cubic-bezier(.2,.7,.2,1);
    cursor: pointer;
}

.cover-front,
.cover-back {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 0 8px 8px 0;
}

.cover-front {
    background: linear-gradient(
        135deg,
        #285b6d,
        #173b4b 70%,
        #102d3a
    );
    color: #f7e8c5;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: inset -5px 0 10px #00000030;
}

.cover-back {
    background: #173b4b;
    transform: rotateY(180deg);
}

.cover-design {
    width: 85%;
    height: 91%;
    border: 1px solid #e6c994;
    outline: 1px solid #e6c99455;
    outline-offset: -8px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 5px;
}

.cover-design small {
    font: 8px Arial, sans-serif;
    letter-spacing: 2px;
}

.cover-design h1 {
    font-size: clamp(27px, 5vw, 48px);
    line-height: .95;
    margin: 25px 0;
}

.cover-design span {
    width: 35px;
    height: 1px;
    background: #e6c994;
    margin-bottom: 15px;
}

/* BOEK OPENEN */

#cover-toggle {
    display: none;
}

#cover-toggle:checked + .book .cover {
    transform: rotateY(-180deg);
}

/* SPINE */

.spine {
    position: absolute;
    z-index: 25;
    width: 9px;
    height: 100%;
    left: -4px;
    background: linear-gradient(90deg, #102b36, #477487);
}

/* 3D PAGINA OMSLAAN */

.turn-sheet {
    position: absolute;
    top: 0;
    height: 100%;
    width: 50%;
    z-index: 10;
    transform-style: preserve-3d;
    pointer-events: none;
    background: #fffdf5;
}

.turn-sheet.next {
    right: 0;
    transform-origin: left center;
    animation: flipForward .95s cubic-bezier(.55,.05,.35,1) forwards;
}

.turn-sheet.prev {
    left: 0;
    transform-origin: right center;
    animation: flipBackward .95s cubic-bezier(.55,.05,.35,1) forwards;
}

.turn-face {
    position: absolute;
    inset: 0;
    padding: clamp(15px, 3vw, 38px);
    overflow: hidden;
    background-color: #fffdf5;
    background-image: repeating-linear-gradient(
        transparent,
        transparent 29px,
        #e9e3d6 30px
    );
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
}

.turn-face.front {
    z-index: 2;
}

.turn-face.back {
    transform: rotateY(180deg);
}

.turn-sheet.next .turn-face.front {
    border-radius: 0 7px 7px 0;
}

.turn-sheet.next .turn-face.back {
    border-radius: 7px 0 0 7px;
}

.turn-sheet.prev .turn-face.front {
    border-radius: 7px 0 0 7px;
}

.turn-sheet.prev .turn-face.back {
    border-radius: 0 7px 7px 0;
}

/* SCHADUW OP HET BLAD */

.turn-sheet::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    background: linear-gradient(
        90deg,
        rgba(0,0,0,.23),
        transparent 35%,
        rgba(0,0,0,.06)
    );
    opacity: 0;
    animation: pageShade .95s ease forwards;
}

@keyframes pageShade {
    0% { opacity: .08; }
    45% { opacity: .28; }
    100% { opacity: .04; }
}

@keyframes flipForward {
    0% { transform: rotateY(0deg); }
    45% { transform: rotateY(-95deg); }
    100% { transform: rotateY(-180deg); }
}

@keyframes flipBackward {
    0% { transform: rotateY(0deg); }
    45% { transform: rotateY(95deg); }
    100% { transform: rotateY(180deg); }
}

/* MOBIEL */

@media(max-width: 600px) {
    .heading {
        margin-bottom: 35px;
        font-size: 9px;
    }

    .book {
        width: 96vw;
        height: 67vw;
        min-height: 260px;
        max-height: 410px;
    }

    .page {
        padding: 12px 9px;
    }

    .page h2 {
        font-size: clamp(14px, 4vw, 21px);
        margin-bottom: 12px;
    }

    .page p {
        font-size: clamp(8px, 2.2vw, 11px);
        line-height: 1.55;
    }

    .page small {
        font-size: 7px;
        margin-bottom: 12px;
    }

    .toc {
        gap: 8px;
    }

    .toc a {
        font-size: clamp(8px, 2vw, 11px);
        padding-bottom: 4px;
    }

    .turn-face {
        padding: 12px 9px;
    }
}

</style>
</head>

<body>

<div class="heading">INTERACTIVE DIGITAL BOOK</div>

<input type="checkbox" id="cover-toggle">

<div class="book" id="book">

    <div class="page left" id="left-page"></div>
    <div class="page right" id="right-page"></div>

    <!-- KAFT -->
    <label class="cover" for="cover-toggle">
        <div class="cover-front">
            <div class="cover-design">
                <small>EEN BIJZONDER VERHAAL</small>
                <h1>THE<br>STORY<br>BOOK</h1>
                <span></span>
                <small>OPEN MIJ & ONTDEK</small>
            </div>
        </div>
        <div class="cover-back"></div>
    </label>

    <div class="spine"></div>

</div>

<div class="heading" style="margin-top:35px">
    KLIK OP EEN PAGINA OM TE BLADEREN
</div>

<script>

/* PAGINA'S */

const pages = [

{
html: `
<small>OVERZICHT</small>
<h2>Inhoud</h2>
<nav class="toc">
<a href="#" data-goto="0">01. Het begin <span>02</span></a>
<a href="#" data-goto="1">02. Het avontuur <span>04</span></a>
<a href="#" data-goto="2">03. Nieuwe werelden <span>06</span></a>
<a href="#" data-goto="3">04. De ontdekking <span>08</span></a>
<a href="#" data-goto="4">05. Het einde <span>10</span></a>
</nav>`
},

{
html: `
<small>HOOFDSTUK 01</small>
<h2>Het begin</h2>
<p>Elk verhaal begint ergens. Soms met een klein idee, soms met een groot avontuur.</p>
<p>Dit boek neemt je mee op een reis door bijzondere momenten.</p>`
},

{
html: `
<small>HOOFDSTUK 01</small>
<h2>Een nieuwe wereld</h2>
<p>Er gaat een wereld open wanneer je de eerste stap zet.</p>
<p>Alles wat je ontdekt, begint met nieuwsgierigheid.</p>`
},

{
html: `
<small>HOOFDSTUK 02</small>
<h2>Het avontuur</h2>
<p>Een avontuur is nooit helemaal voorspelbaar.</p>
<p>Juist dat maakt het bijzonder. Iedere bladzijde brengt iets nieuws.</p>`
},

{
html: `
<small>HOOFDSTUK 02</small>
<h2>Onderweg</h2>
<p>Soms loopt een pad anders dan verwacht.</p>
<p>Neem de tijd om om je heen te kijken.</p>`
},

{
html: `
<small>HOOFDSTUK 03</small>
<h2>Nieuwe werelden</h2>
<p>Er zijn altijd nieuwe dingen om te ontdekken.</p>
<p>Iedere ervaring voegt iets toe aan je verhaal.</p>`
},

{
html: `
<small>HOOFDSTUK 03</small>
<h2>Blijf ontdekken</h2>
<p>Nieuwsgierigheid is het begin van iedere ontdekking.</p>
<p>Durf verder te kijken dan de pagina die voor je ligt.</p>`
},

{
html: `
<small>HOOFDSTUK 04</small>
<h2>De ontdekking</h2>
<p>Na iedere stap ontdek je iets nieuws.</p>
<p>Soms is het antwoord dichterbij dan je denkt.</p>`
},

{
html: `
<small>HOOFDSTUK 04</small>
<h2>Bijna aan het einde</h2>
<p>Een verhaal bestaat uit veel kleine momenten.</p>
<p>Samen vormen ze iets groots.</p>`
},

{
html: `
<small>HOOFDSTUK 05</small>
<h2>Het einde?</h2>
<p>Elk einde is misschien wel het begin van een nieuw verhaal.</p>
<p>Bedankt voor het lezen!</p>`
}

];

let spread = 0;
let animating = false;

const book = document.getElementById("book");
const leftPage = document.getElementById("left-page");
const rightPage = document.getElementById("right-page");

const totalSpreads = Math.ceil(pages.length / 2);

/* PAGINA HTML */

function pageHTML(index, side) {

    const page = pages[index];

    if (!page) {
        return `<div class="page-content"><h2>Einde</h2></div>`;
    }

    return `
        <div class="page-content">
            ${page.html}
            <span class="page-number">${index + 1}</span>
        </div>
    `;
}

/* PAGINA'S TONEN */

function renderPages() {

    const leftIndex = spread * 2;
    const rightIndex = spread * 2 + 1;

    leftPage.innerHTML = pageHTML(leftIndex, "left");
    rightPage.innerHTML = pageHTML(rightIndex, "right");

}

/* ANIMATIE */

function turnPage(direction) {

    if (animating) return;

    if (direction === "next" && spread >= totalSpreads - 1) return;
    if (direction === "prev" && spread <= 0) return;

    animating = true;

    const oldSpread = spread;
    const newSpread = direction === "next"
        ? spread + 1
        : spread - 1;

    const sheet = document.createElement("div");
    sheet.className = "turn-sheet " + direction;

    const frontIndex = direction === "next"
        ? oldSpread * 2 + 1
        : oldSpread * 2;

    const backIndex = direction === "next"
        ? newSpread * 2
        : newSpread * 2 + 1;

    sheet.innerHTML = `
        <div class="turn-face front">
            ${pageHTML(frontIndex)}
        </div>
        <div class="turn-face back">
            ${pageHTML(backIndex)}
        </div>
    `;

    book.appendChild(sheet);

    sheet.addEventListener("animationend", () => {

        spread = newSpread;
        renderPages();
        sheet.remove();
        animating = false;

    }, { once: true });

}

function nextPage() {
    turnPage("next");
}

function previousPage() {
    turnPage("prev");
}

/* HELE PAGINA KLIKBAAR */

rightPage.addEventListener("click", (event) => {

    if (event.target.closest("[data-goto]")) return;

    nextPage();

});

leftPage.addEventListener("click", (event) => {

    if (event.target.closest("[data-goto]")) return;

    previousPage();

});

/* INHOUDSOPGAVE */

document.addEventListener("click", (event) => {

    const link = event.target.closest("[data-goto]");

    if (!link) return;

    event.preventDefault();

    if (animating) return;

    spread = Number(link.dataset.goto);

    renderPages();

});

/* START */

renderPages();

</script>

</body>
</html>
